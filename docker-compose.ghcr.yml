# Docker Compose конфигурация для запуска с образами из GitHub Container Registry
#
# Использование:
#   docker-compose -f docker-compose.ghcr.yml up -d
#
# Для приватных образов необходима аутентификация:
#   echo "ghp_your_token" | docker login ghcr.io -u lex090 --password-stdin
#
# Переменные окружения:
#   ARBITRAGE_SCANNER_IMAGE_VERSION - версия образа ktor приложения (по умолчанию: latest)

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: arbitrage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.25
    container_name: liquibase
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --changelog-file=db.changelog-master.yaml
      --url=jdbc:postgresql://postgres:5432/arbitrage
      --username=postgres
      --password=postgres
      update
    volumes:
      - ./arbitrage-scanner/arbitrage-scanner-repo-postgres/src/main/resources/db/changelog:/liquibase/changelog
    restart: "no"

  # Ktor приложение - образ из GitHub Container Registry
  arbitrage-scanner:
    image: ghcr.io/lex090/arbitrage-scanner-app-ktor:${ARBITRAGE_SCANNER_IMAGE_VERSION:-latest}
    container_name: arbitrage-scanner-app-ktor
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      fluent-bit:
        condition: service_started
    environment:
      - LOGS_FB_HOSTS=fluent-bit
      - LOGS_FB_PORT=24224
      - SERVICE_NAME=arbitrage-scanner
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=arbitrage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

  # Fluent Bit для сбора stdout логов
  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: fluent-bit
    volumes:
      - ./config/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    command: ["/fluent-bit/bin/fluent-bit", "--config=/fluent-bit/etc/fluent-bit.conf"]

volumes:
  postgres-data:
  kafka-data:
