services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: arbitrage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  liquibase:
    image: liquibase/liquibase:4.25
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      --changelog-file=db.changelog-master.yaml
      --url=jdbc:postgresql://postgres:5432/arbitrage
      --username=postgres
      --password=postgres
      update
    volumes:
      - ./arbitrage-scanner/arbitrage-scanner-repo-postgres/src/main/resources/db/changelog:/liquibase/changelog
    restart: "no"

  # Ktor приложение - образ из GitHub Container Registry
  arbitrage-scanner-app-ktor:
    image: ghcr.io/lex090/arbitrage-scanner-app-ktor:${ARBITRAGE_SCANNER_IMAGE_VERSION:-latest}
#    deploy:
#      replicas: 4
#      restart_policy:
#        condition: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    environment:
      - SERVICE_NAME=arbitrage-scanner
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=arbitrage
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres

volumes:
  postgres-data: